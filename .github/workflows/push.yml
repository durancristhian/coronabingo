name: CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}
      AUTH_DOMAIN: ${{ secrets.AUTH_DOMAIN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PROJECT_ID: ${{ secrets.PROJECT_ID }}
      STORAGE_BUCKET: ${{ secrets.STORAGE_BUCKET }}
      MESSAGING_SENDER_ID: ${{ secrets.MESSAGING_SENDER_ID }}
      APP_ID: ${{ secrets.APP_ID }}
      MEASUREMENT_ID: ${{ secrets.MEASUREMENT_ID }}

      GA_TRACKING_ID: ${{ secrets.GA_TRACKING_ID }}

      SENTRY_DSN: ''

      URL: ${{ secrets.URL }}

      CYPRESS_PROJECT_KEY: ${{ secrets.CYPRESS_PROJECT_KEY }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report runtime versions
        run: |
          node --version
          npm --version

      - name: Restore Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('.nvmrc', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('.nvmrc', 'package-lock.json') }}-

      - run: npm ci

      - run: npm run lint:check

      # Cypress restoration is outside the Node 24 migration.
      # - run: npm t

      # prebuild validates locales; the analyzer writes downloadable bundle reports.
      - run: npm run build
        env:
          ANALYZE_BUNDLE: '1'

      - name: Upload bundle reports
        uses: actions/upload-artifact@v7.0.1
        with:
          name: bundle-reports
          path: .next/analyze/*.html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
